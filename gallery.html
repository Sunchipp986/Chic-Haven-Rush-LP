<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
        }

        /* ================= NAVBAR ================= */
        .navbar {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
        }

        .nav-links a:hover {
            color: #f39c12;
        }

        /* ================= HEADER ================= */
        .dark-header {
            background-image: url('gallery.png');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .dark-header::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* ================= GRID (FINAL FIX) ================= */
        .left-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 250px));
            justify-content: center;
            gap: 40px;
            padding: 40px 20px;
        }

        /* image button styling */
        .download-button img {
            width: 250px;
            height: auto;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            display: block;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .download-button img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* mobile responsiveness */
        @media (max-width: 600px) {
            .left-buttons {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .download-button img {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<!-- HEADER -->
<header class="dark-header">
    <div class="header-content">
        <h1>Garage Gallery</h1>
        <p>Explore our collection of cars</p>
    </div>
</header>

<!-- GALLERY -->
<div class="left-buttons">

    <a href="https://github.com/Distance-Modding/Custom-Cars/raw/refs/heads/main/Real%20Cars/%5BEMR%5D%20Scruff's%20Nissan%20GTR" class="download-button">

    <a href="https://github.com/Distance-Modding/Custom-Cars/raw/refs/heads/main/Original%20Cars/%5BEMR%5D%20Hellhorn" class="download-button">

	</div>
	
<div class="left-buttons">

	<a href="https://github.com/Distance-Modding/Custom-Cars/raw/refs/heads/main/Real%20Cars/%5BEMR%5D%20Axel's%20WRX%20STI" class="download-button">

	<a href="https://github.com/Distance-Modding/Custom-Cars/raw/refs/heads/main/Real%20Cars/%5BEMR%5D%20Ransak's%2068%20Mustang" class="download-button">

</div>

<div class="left-buttons">

</div>

<!-- Sound Effects -->
<audio id="hoverSound" preload="auto">
    <source src="poloroid paper.mp3" type="audio/mpeg">
</audio>

<audio id="clickSound" preload="auto">
    <source src="poloroid pull.mp3" type="audio/mpeg">
</audio>

<script>
const hoverSound = document.getElementById('hoverSound');
const clickSound = document.getElementById('clickSound');

document.querySelectorAll('.download-button').forEach(button => {

    button.addEventListener('mouseenter', () => {
        hoverSound.currentTime = 0;
        hoverSound.play().catch(() => {});
    });

    button.addEventListener('click', () => {
        clickSound.currentTime = 0;
        clickSound.play().catch(() => {});
    });

});
</script>

</body>
</html>
